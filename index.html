<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f11">
<title>Семейный бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- Экран входа -->
<section id="auth" class="auth" hidden>
  <div class="auth__card">
    <div class="auth__logo">₽</div>
    <h1 class="auth__title">Семейный бюджет</h1>
    <p class="auth__sub">Общие расходы семьи в динарах, евро и шекелях</p>
    <button id="btn-signin" class="btn btn--primary btn--wide">Войти через Google</button>
    <p id="auth-error" class="auth__error" hidden></p>
  </div>
</section>

<!-- Приложение -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar__left">
      <button id="btn-prev-month" class="icon-btn" aria-label="Предыдущий месяц">‹</button>
      <button id="btn-month" class="topbar__month"></button>
      <button id="btn-next-month" class="icon-btn" aria-label="Следующий месяц">›</button>
    </div>
    <button id="btn-base-currency" class="chip chip--currency" title="Валюта сводных сумм"></button>
  </header>

  <main id="view" class="view"></main>

  <button id="btn-add" class="fab" aria-label="Добавить операцию">+</button>

  <nav class="tabbar">
    <button class="tab" data-route="dashboard"><span class="tab__ico">◍</span>Главная</button>
    <button class="tab" data-route="list"><span class="tab__ico">≡</span>Операции</button>
    <button class="tab" data-route="charts"><span class="tab__ico">◔</span>Графики</button>
    <button class="tab" data-route="settings"><span class="tab__ico">⚙</span>Ещё</button>
  </nav>
</div>

<!-- Слои поверх -->
<div id="sheet-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
