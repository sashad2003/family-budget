<!DOCTYPE html>
<!-- lang и dir проставляет i18n.js: в иврите вся страница разворачивается -->
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<title>Семейный бюджет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Heebo — для иврита: у Geologica еврейских букв нет, и система подставляла
     бы что попало. Файлы шрифта скачиваются только если им что-то набрано. -->
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- ?v меняется при правках: заставляет браузер взять новый файл, а не старый из кеша -->
<link rel="stylesheet" href="assets/css/app.css?v=54">

<!-- Установка на телефон: значок на рабочем столе и запуск без адресной строки -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png?v=54" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бюджет">
</head>
<body>

<!-- Сияние на фоне: живёт под всеми экранами -->
<div class="aurora" aria-hidden="true">
  <span class="aurora__blob aurora__blob--a"></span>
  <span class="aurora__blob aurora__blob--b"></span>
  <span class="aurora__blob aurora__blob--c"></span>
  <span class="aurora__grain"></span>
</div>

<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- Экран входа -->
<section id="auth" class="auth" hidden>
  <div class="auth__card glass">
    <div class="auth__logo"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6"/><path d="M8.7 8.7 6.1 6.1M15.3 8.7 17.9 6.1M8.7 15.3 6.1 17.9M15.3 15.3 17.9 17.9"/></svg></div>
    <h1 class="auth__title" data-i18n="app.title"></h1>
    <p class="auth__sub" data-i18n="auth.tagline"></p>
    <button id="btn-signin" class="btn btn--primary btn--wide" data-i18n="auth.signin"></button>
    <p id="auth-error" class="auth__error" hidden></p>

    <!-- Документы читают до входа: проверяющему из Google и любому осторожному
         человеку они нужны раньше, чем аккаунт. -->
    <p class="auth__legal">
      <a href="privacy.html" data-i18n="legal.privacy"></a> ·
      <a href="terms.html" data-i18n="legal.terms"></a> ·
      <a href="cookies.html" data-i18n="legal.cookies"></a> ·
      <a href="accessibility.html" data-i18n="legal.accessibility"></a>
    </p>
  </div>
</section>

<!-- Анкета при первом входе: имя, телефон, согласие на письма -->
<section id="signup" class="auth" hidden>
  <div id="signup-card" class="auth__card glass"></div>
</section>

<!-- Приложение -->
<div id="app" class="app" hidden>

  <!-- На телефоне это плавающий док внизу, на десктопе — колонка слева -->
  <aside class="rail">
    <div class="rail__brand">
      <span class="rail__mark"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6"/><path d="M8.7 8.7 6.1 6.1M15.3 8.7 17.9 6.1M8.7 15.3 6.1 17.9M15.3 15.3 17.9 17.9"/></svg></span>
      <span class="rail__name" data-i18n="app.name"></span>
    </div>

    <!-- Переключатель бюджетов под логотипом. На телефоне логотипа нет,
         поэтому там для него отдельное место под шапкой. -->
    <button id="btn-budget-rail" class="budget-pick budget-pick--rail" hidden>
      <span class="budget-pick__name"></span>
      <span class="budget-pick__caret">⌄</span>
    </button>

    <!--
      На телефоне в доке помещаются три кнопки: «Обзор», «Платежи» и «Ещё».
      Помеченные tab--desktop живут только в боковой колонке, а на телефоне
      открываются из «Ещё» — иначе пять подписей ломают строку.
    -->
    <nav class="rail__nav">
      <button class="tab" data-route="dashboard">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.4 9.8V20h11.2V9.8"/></svg></span>
        <span class="tab__label" data-i18n="nav.dashboard"></span>
      </button>

      <button class="tab tab--desktop" data-route="list">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h7"/><circle cx="4.8" cy="7" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="17" r="1.1" fill="currentColor" stroke="none"/></svg></span>
        <span class="tab__label" data-i18n="nav.list"></span>
      </button>

      <button class="tab" data-route="bills">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.6h12v16.8l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9.2 8.6h5.6M9.2 12.6h5.6"/></svg><span id="bills-badge" class="badge" hidden></span></span>
        <span class="tab__label" data-i18n="nav.bills"></span>
      </button>

      <button class="tab tab--desktop" data-route="prices">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 3.6H20v7.4l-9 9-7.4-7.4z"/><circle cx="16.4" cy="7.6" r="1.3"/></svg></span>
        <span class="tab__label" data-i18n="nav.prices"></span>
      </button>

      <button class="tab tab--desktop" data-route="charts">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V4.8M19 20v-9.5"/></svg></span>
        <span class="tab__label" data-i18n="nav.charts"></span>
      </button>

      <button class="tab tab--desktop" data-route="settings">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h8.5M17.5 7.5H20M4 16.5h3.5M12.5 16.5H20"/><circle cx="15" cy="7.5" r="2.3"/><circle cx="10" cy="16.5" r="2.3"/></svg></span>
        <span class="tab__label" data-i18n="nav.settings"></span>
      </button>

      <button class="tab tab--desktop" data-route="admin" hidden>
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.4c0-3.4 3.1-5.4 7-5.4s7 2 7 5.4"/></svg></span>
        <span class="tab__label" data-i18n="nav.admin"></span>
      </button>

      <button id="btn-more" class="tab tab--more">
        <span class="tab__ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.2" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.8" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></span>
        <span class="tab__label" data-i18n="nav.more"></span>
      </button>
    </nav>

    <button id="btn-user" class="rail__user">
      <img id="user-photo" class="rail__avatar" alt="" hidden>
      <span id="user-name" class="rail__username"></span>
    </button>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="topbar__period">
        <button id="btn-prev-month" class="icon-btn arrow arrow--prev" data-i18n-label="nav.prevMonth"></button>
        <button id="btn-month" class="topbar__month"></button>
        <button id="btn-next-month" class="icon-btn arrow arrow--next" data-i18n-label="nav.nextMonth"></button>
      </div>

      <div class="topbar__actions">
        <!-- Розовые очки. Второе нажатие снимает режим, и чтобы это было
             видно, у нажатой кнопки сверху загорается красная полоска. -->
        <button id="btn-rose" class="rose-btn" aria-pressed="false">
          <img src="assets/icons/glasses.webp?v=54" alt="" width="680" height="322">
        </button>

        <button id="btn-base-currency" class="chip chip--currency" data-i18n-label="nav.langCurrency"></button>
        <button id="btn-add-wide" class="btn btn--primary btn--add">＋<span data-i18n="nav.addTx"></span></button>
      </div>
    </header>

    <button id="btn-budget-bar" class="budget-pick budget-pick--bar" hidden>
      <span class="budget-pick__name"></span>
      <span class="budget-pick__caret">⌄</span>
    </button>

    <main id="view" class="view"></main>

    <!-- Документы должны попадаться на глаза, а не лежать в настройках:
         их ищут внизу страницы, как в любом сервисе. -->
    <footer class="footer">
      <a href="privacy.html" data-i18n="legal.privacy"></a>
      <a href="terms.html" data-i18n="legal.terms"></a>
      <a href="cookies.html" data-i18n="legal.cookies"></a>
      <a href="accessibility.html" data-i18n="legal.accessibility"></a>
    </footer>
  </div>

  <button id="btn-add" class="fab" data-i18n-label="nav.addTxLabel">＋</button>

  <!-- Связь с автором: висит всегда, потому что писать обычно хотят тогда,
       когда что-то не получилось, — идти за этим в настройки никто не станет. -->
  <a id="btn-whatsapp" class="wa" href="#" target="_blank" rel="noopener"
     data-i18n-label="support.whatsapp" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Z" fill="#fff"/>
      <path d="M9.5 7.3c-.2-.45-.4-.46-.6-.47h-.5c-.17 0-.45.07-.69.32-.24.25-.9.88-.9 2.15s.92 2.5 1.05 2.66c.13.17 1.78 2.85 4.4 3.88 2.18.86 2.62.69 3.1.64.47-.04 1.52-.62 1.73-1.22.21-.6.21-1.11.15-1.22-.06-.1-.23-.17-.48-.29-.25-.13-1.52-.75-1.75-.83-.24-.09-.41-.13-.58.12-.17.25-.67.83-.82 1-.15.17-.3.2-.55.07-.25-.13-1.08-.4-2.05-1.27-.76-.68-1.27-1.51-1.42-1.76-.15-.25-.02-.39.11-.51.11-.11.25-.3.38-.44.12-.15.16-.25.25-.42.08-.17.04-.32-.02-.44-.06-.13-.55-1.4-.78-1.92Z" fill="#25d366"/>
    </svg>
  </a>
</div>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="src/main.js?v=54"></script>
</body>
</html>
